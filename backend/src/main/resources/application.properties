# ===================================================================
# HireSense — Spring Boot Application Configuration
# ===================================================================
spring.application.name=hiresense-backend
server.port=8080

# -------------------------------------------------------------------
# 1. DATABASE CONFIGURATION (Default: H2 In-Memory Database)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:hiresensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# 2. OPTIONAL: MYSQL CONFIGURATION (Uncomment to use MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/hiresense_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# 3. OPTIONAL: POSTGRESQL CONFIGURATION (Uncomment to use PostgreSQL)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/hiresense_db
# spring.datasource.username=postgres
# spring.datasource.password=postgrespassword
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# 4. JWT SECURITY CONFIGURATION
# -------------------------------------------------------------------
hiresense.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
hiresense.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# 5. CORS CONFIGURATION (Allows React Frontend)
# -------------------------------------------------------------------
hiresense.cors.allowed-origins=http://localhost:5173,http://localhost:3000
