# ===================================================================
# HireSense — Spring Boot Application Configuration
# ===================================================================
spring.application.name=hiresense-backend
server.port=${PORT:8080}

# -------------------------------------------------------------------
# 1. DATABASE CONFIGURATION
# Default: In-memory H2 database (Zero setup, starts cleanly on cloud and local)
# Cloud/Custom: Automatically connects to MySQL / Postgres if SPRING_DATASOURCE_URL is provided
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hiresensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Web Console (accessible at /h2-console when in H2 mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# 2. JWT SECURITY CONFIGURATION
# -------------------------------------------------------------------
hiresense.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
hiresense.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# 3. CORS CONFIGURATION (Allows React Frontend)
# -------------------------------------------------------------------
hiresense.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

