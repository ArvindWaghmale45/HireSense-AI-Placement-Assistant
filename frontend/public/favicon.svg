<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with border -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" />

  <!-- Subtle glow backdrop -->
  <circle cx="64" cy="64" r="32" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- Modern Geometric H + Neural Nodes -->
  <!-- Left Pillar / Neural Stem -->
  <rect x="32" y="38" width="12" height="52" rx="6" fill="url(#primaryGrad)" />
  <circle cx="38" cy="40" r="5" fill="#38bdf8" />
  <circle cx="38" cy="64" r="5" fill="#38bdf8" />
  <circle cx="38" cy="88" r="5" fill="#38bdf8" />

  <!-- Neural Interconnects -->
  <line x1="38" y1="64" x2="64" y2="64" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="64" cy="64" r="7" fill="#38bdf8" filter="url(#glow)" />

  <!-- Right Pillar Arch & Placement Star -->
  <path d="M64 64 C 76 64, 86 52, 86 38" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M64 64 C 76 64, 88 78, 88 90" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Placement Star on top right -->
  <polygon points="86,22 89,31 98,31 91,37 93,46 86,40 79,46 81,37 74,31 83,31" fill="url(#starGrad)" filter="url(#glow)" />
</svg>
