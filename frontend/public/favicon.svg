<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="primaryH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bgSleek" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean dark squircle base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgSleek)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Left vertical pillar of 'H' -->
  <rect x="34" y="36" width="15" height="56" rx="7.5" fill="url(#primaryH)" />

  <!-- Right vertical pillar of 'H' -->
  <rect x="79" y="44" width="15" height="48" rx="7.5" fill="url(#primaryH)" />

  <!-- Crossbar of 'H' -->
  <rect x="42" y="59" width="44" height="13" rx="6.5" fill="url(#primaryH)" />

  <!-- Dynamic Upward Growth Arrow swoosh across 'H' -->
  <path d="M26 78 C 36 60, 58 48, 92 32" stroke="url(#arrowGrad)" stroke-width="7.5" stroke-linecap="round" filter="url(#subtleGlow)" />
  
  <!-- Arrow Head pointing top-right (growth trajectory) -->
  <polygon points="90,21 103,28 97,41 94,33" fill="#38bdf8" filter="url(#subtleGlow)" />

  <!-- AI Neural node / beacon -->
  <circle cx="68" cy="40" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)" />
  <line x1="68" y1="40" x2="52" y2="48" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="2 3" />
</svg>
